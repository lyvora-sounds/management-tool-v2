  <text x="52" y="354" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Subtask checklist</text>
  <text x="52" y="374" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Comment thread</text>
  <text x="52" y="394" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Attachment (Blob)</text>
  <text x="52" y="414" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">TaskLabel · CustomValue</text>
  <text x="52" y="434" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">TaskCollaborator</text>

  <rect x="304" y="296" width="200" height="152" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="324" y="328" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">On a board</text>
  <text x="324" y="354" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">BoardMember.role</text>
  <text x="324" y="374" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Invitation token</text>
  <text x="324" y="394" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">ActivityLog (last 100)</text>
  <text x="324" y="414" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Label · Epic · CustomField</text>
  <text x="324" y="434" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Slack / Discord URLs</text>

  <rect x="576" y="296" width="472" height="152" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="596" y="328" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Task people</text>
  <text x="596" y="354" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">assigneeId — primary owner of the work</text>
  <text x="596" y="374" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">qaId — reviewer</text>
  <text x="596" y="394" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">collaborators — extra watchers (notified on comments)</text>
  <text x="596" y="414" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">completedById — who ticked it done</text>
  <text x="596" y="434" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Assigning is gated by admin or memberCanAssign</text>
