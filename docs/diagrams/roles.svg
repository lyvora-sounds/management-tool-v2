<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="32" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Board roles</text>
  <text x="968" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">getBoardRole · canManageBoard · canDeleteBoard</text>

  <rect x="32" y="48" width="300" height="340" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Effective role</text>
  <text x="52" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Resolved from Board.userId or BoardMember.role</text>

  <g transform="translate(52, 122)">
    <g fill="none" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round">
      <path d="M16 2 l8 3 v7 c0 6-3.6 9.5-8 11 C7.6 21.5 4 18 4 12 V5 z"/>
    </g>
    <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Owner</text>
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Board.userId — not a member row</text>
  </g>

  <g transform="translate(52, 188)">
    <g fill="none" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round">
      <circle cx="10" cy="16" r="6"/>
      <line x1="16" y1="16" x2="28" y2="16"/>
      <line x1="24" y1="16" x2="24" y2="21"/>
      <line x1="27" y1="16" x2="27" y2="20"/>
    </g>
    <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Admin</text>
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Assignable BoardMember.role</text>
  </g>

  <g transform="translate(52, 254)">
    <g fill="none" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round">
      <circle cx="16" cy="10" r="6"/>
      <path d="M5 28 c1.5-7 6-11 11-11 s9.5 4 11 11"/>
    </g>
    <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Member</text>
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Default · unknown roles collapse here</text>
  </g>

  <g transform="translate(52, 320)">
    <g fill="none" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="8" width="24" height="16" rx="3"/>
      <path d="M12 16 h8"/>
    </g>
    <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0f172a">memberCanAssign</text>
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Board switch for member assignments</text>
  </g>

  <rect x="364" y="48" width="604" height="100" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
  <g transform="translate(384, 68)" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round">
    <path d="M16 2 l8 3 v7 c0 6-3.6 9.5-8 11 C7.6 21.5 4 18 4 12 V5 z"/>
  </g>
  <text x="432" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Owner</text>
  <text x="432" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Everything an admin can do, plus delete the board. Cannot be removed via the members API. Exactly one per board.</text>
  <text x="432" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Only owner can remove another admin.</text>

  <rect x="364" y="168" width="604" height="100" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <g transform="translate(384, 188)" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round">
    <circle cx="10" cy="16" r="6"/>
    <line x1="16" y1="16" x2="28" y2="16"/>
    <line x1="24" y1="16" x2="24" y2="21"/>
    <line x1="27" y1="16" x2="27" y2="20"/>
  </g>
  <text x="432" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Admin</text>
  <text x="432" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Invite, change member/admin roles, kick members, toggle memberCanAssign, custom fields, integrations.</text>
  <text x="432" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Cannot delete the board or kick another admin.</text>

  <rect x="364" y="288" width="604" height="100" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <g transform="translate(384, 308)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round">
    <rect x="4" y="6" width="24" height="20" rx="3"/>
    <path d="M8 14 h16 M8 18 h10"/>
  </g>
  <text x="432" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Member</text>
  <text x="432" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Create/edit/move tasks, comments, attachments, subtasks. Hidden 404 on manage endpoints.</text>
  <text x="432" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Assign people only when board.memberCanAssign is true (admins always can).</text>
</svg>
