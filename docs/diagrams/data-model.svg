<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <rect width="1080" height="480" fill="#F7F7F7"/>
  <defs>
    <marker id="dmTipGold" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#D3A05B" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="32" y="28" width="1" height="16" fill="#D3A05B"/>
  <text x="42" y="41" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">DATA MODEL</text>
  <text x="1048" y="41" text-anchor="end" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Owner lives on Board.userId</text>
  <text x="32" y="76" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">
    <tspan fill="#13233C">Core data </tspan><tspan fill="#D3A05B">model</tspan>
  </text>
  <rect x="32" y="90" width="40" height="2" fill="#D3A05B"/>

  <rect x="32" y="120" width="200" height="150" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(52, 136)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <circle cx="16" cy="10" r="6"/>
    <path d="M5 28 c1.5-7 6-11 11-11 s9.5 4 11 11"/>
  </g>
  <text x="52" y="186" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">User</text>
  <text x="52" y="210" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">clerkId · email · name</text>
  <text x="52" y="230" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">settings · calendarSync</text>
  <text x="52" y="250" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">notifications</text>

  <line x1="232" y1="195" x2="296" y2="195" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#dmTipGold)"/>
  <text x="264" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#D3A05B">OWNS</text>

  <rect x="304" y="120" width="200" height="150" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(324, 136)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <rect x="4" y="6" width="24" height="20" rx="3"/>
    <path d="M8 12 h16"/>
  </g>
  <text x="324" y="186" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Board</text>
  <text x="324" y="210" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">owner userId</text>
  <text x="324" y="230" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">members · invitations</text>
  <text x="324" y="250" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">labels · epics · fields</text>

  <line x1="504" y1="195" x2="568" y2="195" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#dmTipGold)"/>
  <text x="536" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#D3A05B">HAS</text>

  <rect x="576" y="120" width="200" height="150" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
