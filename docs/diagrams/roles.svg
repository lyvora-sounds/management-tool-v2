<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <rect width="1080" height="480" fill="#F7F7F7"/>
  <defs>
    <marker id="roleTipGold" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#D3A05B" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="32" y="28" width="1" height="16" fill="#D3A05B"/>
  <text x="42" y="41" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">ACCESS</text>
  <text x="1048" y="41" text-anchor="end" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">getBoardRole · canManageBoard · canDeleteBoard</text>
  <text x="32" y="76" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">
    <tspan fill="#13233C">Board </tspan><tspan fill="#D3A05B">roles</tspan>
  </text>
  <rect x="32" y="90" width="40" height="2" fill="#D3A05B"/>

  <rect x="32" y="120" width="340" height="328" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="56" y="152" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Effective role</text>
  <text x="56" y="174" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Resolved from Board.userId or BoardMember.role</text>

  <g transform="translate(56, 198)">
    <g fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
      <path d="M16 2 l8 3 v7 c0 6-3.6 9.5-8 11 C7.6 21.5 4 18 4 12 V5 z"/>
    </g>
    <text x="44" y="14" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#13233C">Owner</text>
    <text x="44" y="34" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Board.userId — not a member row</text>
  </g>

  <g transform="translate(56, 260)">
    <g fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
      <circle cx="10" cy="16" r="6"/>
      <line x1="16" y1="16" x2="28" y2="16"/>
      <line x1="24" y1="16" x2="24" y2="21"/>
      <line x1="27" y1="16" x2="27" y2="20"/>
    </g>
    <text x="44" y="14" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#13233C">Admin</text>
    <text x="44" y="34" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Assignable BoardMember.role</text>
  </g>

  <g transform="translate(56, 322)">
    <g fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
      <circle cx="16" cy="10" r="6"/>
      <path d="M5 28 c1.5-7 6-11 11-11 s9.5 4 11 11"/>
    </g>
    <text x="44" y="14" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#13233C">Member</text>
    <text x="44" y="34" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Default · unknown roles collapse here</text>
  </g>

  <g transform="translate(56, 384)">
    <g fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
      <rect x="4" y="8" width="24" height="16" rx="3"/>
      <path d="M12 16 h8"/>
    </g>
    <text x="44" y="14" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#13233C">memberCanAssign</text>
    <text x="44" y="34" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Board switch for member assignments</text>
  </g>

  <line x1="372" y1="176" x2="408" y2="176" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#roleTipGold)"/>
  <rect x="416" y="120" width="632" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(436, 148)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <path d="M16 2 l8 3 v7 c0 6-3.6 9.5-8 11 C7.6 21.5 4 18 4 12 V5 z"/>
  </g>
  <text x="484" y="160" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Owner</text>
  <text x="484" y="182" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Everything an admin can do, plus delete the board. Cannot be removed</text>
  <text x="484" y="202" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">via the members API. Exactly one per board. Only owner can remove another admin.</text>

  <line x1="372" y1="288" x2="408" y2="288" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#roleTipGold)"/>
  <rect x="416" y="232" width="632" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(436, 260)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <circle cx="10" cy="16" r="6"/>
    <line x1="16" y1="16" x2="28" y2="16"/>
    <line x1="24" y1="16" x2="24" y2="21"/>
    <line x1="27" y1="16" x2="27" y2="20"/>
  </g>
  <text x="484" y="272" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Admin</text>
  <text x="484" y="294" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Invite, change member/admin roles, kick members, toggle memberCanAssign,</text>
  <text x="484" y="314" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">custom fields, integrations. Cannot delete the board or kick another admin.</text>

  <line x1="372" y1="400" x2="408" y2="400" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#roleTipGold)"/>
  <rect x="416" y="344" width="632" height="104" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(436, 372)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <rect x="4" y="6" width="24" height="20" rx="3"/>
    <path d="M8 14 h16 M8 18 h10"/>
  </g>
  <text x="484" y="384" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Member</text>
  <text x="484" y="406" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Create/edit/move tasks, comments, attachments, subtasks. Hidden 404 on manage</text>
  <text x="484" y="426" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">endpoints. Assign people only when board.memberCanAssign is true (admins always can).</text>
</svg>
