  <text x="868" y="210" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">assignee · QA</text>
  <text x="868" y="230" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">epic · shareToken</text>
  <text x="868" y="250" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">archived · dates</text>

  <rect x="32" y="296" width="200" height="152" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
