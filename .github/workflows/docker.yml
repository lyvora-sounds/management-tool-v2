name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Postgres
    runs-on: ubuntu-latest

    # Throwaway Postgres. Applies migrations from scratch, the path that
    # broke when a schema.prisma change reached main without its migration.
    # Does not run on every PR: only on workflow_dispatch or push to main.
    services:
      postgres:
        # Official image mirror: avoids Docker Hub anonymous pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Direct connection to the runner database: no pooler, so the
      # migrate deploy advisory lock works without the P1002 we saw on Vercel.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 21 Oct 2026 Node.js security release. Keep the patch pin.
          node-version-file: .node-version
          cache: pnpm

      - name: Reject unpatched Node.js
        run: node scripts/check-node-patch.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations on an empty database
        run: pnpm exec prisma migrate deploy

      - name: Check schema.prisma matches the migrations
        # SQL output means schema.prisma changed without a migration.
        # The first command prints the diff; the second fails.
        run: |
          pnpm exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --script
          pnpm exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --exit-code
