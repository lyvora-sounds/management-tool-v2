<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 860" width="100%" height="100%">
  <rect width="1560" height="860" fill="#F7F7F7"/>
  <defs>
    <marker id="workTip" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#D3A05B" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="32" y="28" width="1" height="16" fill="#D3A05B"/>
  <text x="42" y="41" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">WORK</text>
  <text x="1528" y="41" text-anchor="end" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Arrow marks the referenced row</text>
  <text x="32" y="78" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">
    <tspan fill="#13233C">How a task is </tspan><tspan fill="#D3A05B">stored</tspan>
  </text>
  <rect x="32" y="92" width="40" height="2" fill="#D3A05B"/>

  <!-- boardId bus into Board -->
  <path d="M560 252 V284 H170 V252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#workTip)"/>
  <path d="M700 252 V284" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M1082 252 V284" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M1320 252 V284 H560" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300" y="312" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">boardId</text>

  <!-- Task.listId → List, Task.epicId → Epic -->
  <path d="M430 352 V252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#workTip)"/>
  <path d="M820 352 V252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#workTip)"/>
  <text x="442" y="340" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">listId</text>
  <text x="832" y="340" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">epicId</text>

  <!-- Children → Task, and the second keys on TaskLabel and CustomFieldValue -->
  <path d="M1155 612 V252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#workTip)"/>
  <path d="M1405 612 V252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#workTip)"/>
  <path d="M155 612 V572 H1405" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M405 612 V572" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M655 612 V572" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M905 612 V572" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M640 572 V520" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#workTip)"/>
  <text x="1188" y="400" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">labelId</text>
  <text x="1418" y="400" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">fieldId</text>
  <text x="760" y="564" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">taskId</text>

  <!-- Parents -->
  <rect x="32" y="116" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="52" y="156" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Board</text>
  <text x="52" y="188" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">One organization</text>
  <text x="52" y="212" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Owner is userId</text>
  <text x="52" y="236" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Delete cascades children</text>

  <rect x="336" y="116" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="356" y="156" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">List</text>
  <text x="356" y="188" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">boardId cascade</text>
  <text x="356" y="212" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">title and order</text>
  <text x="356" y="236" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">A task needs one list</text>

  <rect x="640" y="116" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="660" y="156" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Epic</text>
  <text x="660" y="188" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">boardId cascade</text>
  <text x="660" y="212" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">quarter and status</text>
  <text x="660" y="236" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Task link is optional</text>

  <rect x="944" y="116" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="964" y="156" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Label</text>
  <text x="964" y="188" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">boardId cascade</text>
  <text x="964" y="212" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">title and color</text>
  <text x="964" y="236" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Applied via TaskLabel</text>

  <rect x="1248" y="116" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1268" y="156" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">CustomField</text>
  <text x="1268" y="188" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">boardId cascade</text>
  <text x="1268" y="212" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">text, number, or select</text>
  <text x="1268" y="236" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Unique default key</text>

  <!-- Task -->
  <rect x="336" y="352" width="580" height="168" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="360" y="392" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Task</text>
  <text x="360" y="424" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">listId required, on delete cascade</text>
  <text x="360" y="448" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">epicId optional, on delete set null</text>
  <text x="360" y="472" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">assigneeId, qaId, completedById set null</text>
  <text x="360" y="496" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">order, dates, archive, share token</text>

  <!-- Children -->
  <rect x="40" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="60" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Subtask</text>
  <text x="60" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">taskId cascade</text>
  <text x="60" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">title, completed, order</text>
  <text x="60" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Checklist on the task</text>

  <rect x="290" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="310" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Comment</text>
  <text x="310" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">taskId cascade</text>
  <text x="310" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">userId cascade</text>
  <text x="310" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Author is required</text>

  <rect x="540" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="560" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Attachment</text>
  <text x="560" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">taskId cascade</text>
  <text x="560" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">filename, url, size</text>
  <text x="560" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Blob url, not the file</text>

  <rect x="790" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="810" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">TaskCollaborator</text>
  <text x="810" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Key task + user</text>
  <text x="810" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Both cascade</text>
  <text x="810" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Comment watchers</text>

  <rect x="1040" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1060" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">TaskLabel</text>
  <text x="1060" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Key task + label</text>
  <text x="1060" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Both cascade</text>
  <text x="1060" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Many labels per task</text>

  <rect x="1290" y="612" width="230" height="156" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1310" y="652" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">CustomFieldValue</text>
  <text x="1310" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Unique task + field</text>
  <text x="1310" y="708" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">value is a string</text>
  <text x="1310" y="732" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Both cascade</text>

  <text x="32" y="828" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">SELKET.AI</text>
</svg>
