<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" width="100%" height="100%">
  <rect width="1360" height="840" fill="#F7F7F7"/>
  <defs>
    <marker id="accessTip" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#D3A05B" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="36" y="28" width="1" height="16" fill="#D3A05B"/>
  <text x="46" y="41" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">ACCESS</text>
  <text x="1324" y="41" text-anchor="end" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Arrow marks the referenced row</text>
  <text x="36" y="78" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">
    <tspan fill="#13233C">Who can open a </tspan><tspan fill="#D3A05B">board</tspan>
  </text>
  <rect x="36" y="92" width="40" height="2" fill="#D3A05B"/>

  <!-- Owner rail: Board.userId → User -->
  <path d="M1161 128 V114 H171 V128" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <text x="640" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">userId</text>

  <!-- 1:1 satellites → User -->
  <path d="M36 422 H18 V202 H36" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <path d="M36 642 H18 V202" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="28" y="328" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">1 : 1</text>
  <text x="28" y="548" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">1 : 1</text>

  <!-- Join tables → User -->
  <path d="M366 642 H336 V202 H306" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <path d="M366 422 H336" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M366 202 H336" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <text x="336" y="190" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>
  <text x="336" y="410" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>
  <text x="336" y="630" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>

  <!-- Join tables → parent -->
  <path d="M636 202 H696" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <path d="M636 422 H696" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <text x="666" y="190" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>
  <text x="666" y="410" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>

  <!-- Team → Organization -->
  <path d="M831 348 V276" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <text x="842" y="320" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>

  <!-- Board.organizationId → Organization -->
  <path d="M1026 202 H966" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <text x="996" y="190" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>

  <!-- BoardTeamAccess → Team -->
  <path d="M1026 422 H966" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <text x="996" y="410" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">N : 1</text>

  <!-- Grants and members → Board, along the right rail and the bottom channel -->
  <path d="M1296 422 H1330 V202 H1296" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accessTip)"/>
  <path d="M1296 642 H1330" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M501 716 V758 H1330 V642" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="760" y="748" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8A5F24">boardId</text>

  <!-- Row 1 -->
  <rect x="36" y="128" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="56" y="164" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">User</text>
  <text x="56" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">clerkId and email, unique</text>
  <text x="56" y="220" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Owns boards via userId</text>
  <text x="56" y="244" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Owner delete cascades them</text>

  <rect x="366" y="128" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="386" y="164" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">OrganizationMember</text>
  <text x="386" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Primary key org + user</text>
  <text x="386" y="220" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Role owner, admin, member</text>
  <text x="386" y="244" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Cascade on either delete</text>

  <rect x="696" y="128" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="716" y="164" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Organization</text>
  <text x="716" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">createdById, set null</text>
  <text x="716" y="220" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Delete cascades boards</text>
  <text x="716" y="244" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">and teams</text>

  <rect x="1026" y="128" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1046" y="164" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Board</text>
  <text x="1046" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">userId is the owner</text>
  <text x="1046" y="220" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">organizationId required</text>
  <text x="1046" y="244" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">accessMode, defaultRole</text>

  <!-- Row 2 -->
  <rect x="36" y="348" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="56" y="384" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">UserSettings</text>
  <text x="56" y="416" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">userId unique</text>
  <text x="56" y="440" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">On delete cascade</text>
  <text x="56" y="464" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Encrypted AI provider key</text>

  <rect x="366" y="348" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="386" y="384" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">TeamMember</text>
  <text x="386" y="416" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Primary key team + user</text>
  <text x="386" y="440" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">On delete cascade</text>
  <text x="386" y="464" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">No role column</text>

  <rect x="696" y="348" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="716" y="384" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Team</text>
  <text x="716" y="416" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">organizationId cascade</text>
  <text x="716" y="440" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Name unique in the org</text>
  <text x="716" y="464" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Members are TeamMember</text>

  <rect x="1026" y="348" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1046" y="384" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">BoardTeamAccess</text>
  <text x="1046" y="416" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Primary key board + team</text>
  <text x="1046" y="440" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Role viewer, member, admin</text>
  <text x="1046" y="464" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">On delete cascade</text>

  <!-- Row 3 -->
  <rect x="36" y="568" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="56" y="604" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">UserCalendarSync</text>
  <text x="56" y="636" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">userId unique</text>
  <text x="56" y="660" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">On delete cascade</text>
  <text x="56" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Encrypted Google tokens</text>

  <rect x="366" y="568" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="386" y="604" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">BoardMember</text>
  <text x="386" y="636" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Unique board + user</text>
  <text x="386" y="660" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">admin, member, or viewer</text>
  <text x="386" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Unknown role reads viewer</text>

  <rect x="696" y="568" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="716" y="604" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Reading the wires</text>
  <text x="716" y="636" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Arrow marks the referenced row</text>
  <text x="716" y="660" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">A spine collects many keys</text>
  <text x="716" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Cascade, unless set null</text>

  <rect x="1026" y="568" width="270" height="148" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="1046" y="604" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Invitation</text>
  <text x="1046" y="636" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">boardId, on delete cascade</text>
  <text x="1046" y="660" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Unique token and expiry</text>
  <text x="1046" y="684" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Status starts pending</text>

  <text x="36" y="812" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">SELKET.AI</text>
</svg>
