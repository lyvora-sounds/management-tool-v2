name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    # No Docker here. Postgres runs in docker.yml, on demand or on push to
    # main, so pull requests do not burn the registry pull quota. The app
    # still deploys on Vercel.
    env:
      # Dummy values so the build can compile. They never reach a real
      # service. Do not put live credentials here.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZHVtbXktY2xlcmsta2V5LWZvci1idWlsZCQ
      CLERK_SECRET_KEY: sk_test_ci_dummy_value_for_build_only
      ENCRYPTION_SECRET: ci-dummy-encryption-secret-not-a-real-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Resend constructs its client at module load in the invitation
      # route, so the build fails if this variable is missing.
      RESEND_API_KEY: re_ci_dummy_value_for_build_only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # October 21, 2026 Node.js security release. Keep the patch pin.
          node-version-file: .node-version
          cache: pnpm

      - name: Reject unpatched Node.js
        run: node scripts/check-node-patch.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API types are generated from kiki-api's OpenAPI document. If the API changed and the types here were
      # not regenerated, fail with the instruction. An unreachable API is skipped, not failed.
      - name: API types are current
        run: node scripts/api-types.mjs --check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        # Not blocking yet: inherited lint errors. Remove continue-on-error
        # once those are clean so lint becomes required.
        continue-on-error: true
        run: pnpm lint

      - name: Build
        run: pnpm exec next build
