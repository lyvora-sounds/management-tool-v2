<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="100%" height="100%">
  <rect width="1080" height="360" fill="#F7F7F7"/>
  <defs>
    <marker id="colTipGold" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#D3A05B" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="32" y="28" width="1" height="16" fill="#D3A05B"/>
  <text x="42" y="41" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em" fill="#D3A05B">COLLABORATION</text>
  <text x="1048" y="41" text-anchor="end" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5E7695">Unread poll every 30s</text>
  <text x="32" y="76" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">
    <tspan fill="#13233C">People, comments, </tspan><tspan fill="#D3A05B">notifications</tspan>
  </text>
  <rect x="32" y="90" width="40" height="2" fill="#D3A05B"/>

  <rect x="32" y="120" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(52, 144)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <circle cx="16" cy="10" r="6"/>
    <path d="M5 28 c1.5-7 6-11 11-11 s9.5 4 11 11"/>
  </g>
  <text x="52" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Assign people</text>
  <text x="52" y="222" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Assignee, QA, and</text>
  <text x="52" y="242" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">collaborators.</text>
  <text x="52" y="262" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Skips self-notify</text>

  <line x1="232" y1="220" x2="296" y2="220" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#colTipGold)"/>
  <text x="264" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#D3A05B">COMMENT</text>

  <rect x="304" y="120" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(324, 144)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 8 h20 a4 4 0 0 1 4 4 v8 a4 4 0 0 1-4 4 H14 l-8 6 v-6 H6 a4 4 0 0 1-4-4 v-8 a4 4 0 0 1 4-4 z"/>
  </g>
  <text x="324" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Comment</text>
  <text x="324" y="222" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Tiptap rich text.</text>
  <text x="324" y="242" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Notifies assignee,</text>
  <text x="324" y="262" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">QA, collaborators</text>

  <line x1="504" y1="220" x2="568" y2="220" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#colTipGold)"/>
  <text x="536" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#D3A05B">NOTIFY</text>

  <rect x="576" y="120" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(596, 144)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 20 a6 6 0 0 1 12 0"/>
    <path d="M8 14 a8 8 0 0 1 16 0 v6 H8 z"/>
    <path d="M16 4 v3"/>
  </g>
  <text x="596" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Notification row</text>
  <text x="596" y="222" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">type assigned |</text>
  <text x="596" y="242" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">comment, with boardId</text>
  <text x="596" y="262" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">and taskId</text>

  <line x1="776" y1="220" x2="840" y2="220" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#colTipGold)"/>
  <text x="808" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#D3A05B">POLL</text>

  <rect x="848" y="120" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <g transform="translate(868, 144)" fill="none" stroke="#13233C" stroke-width="1.5" stroke-linecap="round">
    <circle cx="16" cy="16" r="12"/>
    <path d="M16 8 v8 l5 3"/>
  </g>
  <text x="868" y="196" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#13233C">Badge</text>
  <text x="868" y="222" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">GET unread (50),</text>
  <text x="868" y="242" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">30s + on focus,</text>
  <text x="868" y="262" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">mark one / all read</text>
</svg>
