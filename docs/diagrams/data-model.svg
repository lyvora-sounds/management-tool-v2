<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <rect width="1000" height="460" fill="#ffffff"/>
  <defs>
    <marker id="dm-arrow-slate" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#94a3b8"/>
