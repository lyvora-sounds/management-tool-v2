<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e354b"/>
      <stop offset=".5" stop-color="#232839"/>
      <stop offset="1" stop-color="#2b3248"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".085"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".1" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8fa0d6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fa0d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="330" cy="250" rx="520" ry="360" fill="url(#glowA)"/>
  <ellipse cx="1280" cy="760" rx="560" ry="380" fill="url(#glowA)" opacity=".7"/>

  <circle cx="1290" cy="-250" r="650" fill="url(#slab)"/>
  <circle cx="1290" cy="-250" r="650" fill="none" stroke="url(#rim)" stroke-width="6" filter="url(#soft)" opacity=".7"/>
  <circle cx="1290" cy="-250" r="650" fill="none" stroke="url(#rim)" stroke-width="1.6"/>

  <rect x="-300" y="350" width="1560" height="1000" rx="430" fill="url(#slab)"/>
  <rect x="-300" y="350" width="1560" height="1000" rx="430" fill="none" stroke="url(#rim)" stroke-width="6" filter="url(#soft)" opacity=".7"/>
  <rect x="-300" y="350" width="1560" height="1000" rx="430" fill="none" stroke="url(#rim)" stroke-width="1.6"/>

  <rect x="-140" y="660" width="1950" height="900" rx="380" fill="url(#slab)"/>
  <rect x="-140" y="660" width="1950" height="900" rx="380" fill="none" stroke="url(#rim)" stroke-width="6" filter="url(#soft)" opacity=".7"/>
  <rect x="-140" y="660" width="1950" height="900" rx="380" fill="none" stroke="url(#rim)" stroke-width="1.6"/>

  <path d="M-60 520 C 380 430 720 720 1120 570 S 1520 330 1700 400" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.6"/>
