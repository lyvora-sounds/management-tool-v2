name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación
    runs-on: ubuntu-latest

    # Sin Docker. El contenedor de Postgres vive en docker.yml y solo arranca
    # a mano o cuando un merge llega a main. Así un PR no gasta el cupo de
    # pulls del registry. El despliegue de la app sigue siendo Vercel.
    env:
      # Valores ficticios: solo tienen que dejar compilar, nunca se conectan
      # a ningún servicio real. No pongáis credenciales de verdad aquí.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZHVtbXktY2xlcmsta2V5LWZvci1idWlsZCQ
      CLERK_SECRET_KEY: sk_test_ci_dummy_value_for_build_only
      ENCRYPTION_SECRET: ci-dummy-encryption-secret-not-a-real-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Resend construye su cliente a nivel de módulo en la ruta de
      # invitaciones, así que el build falla si esta variable no existe.
      RESEND_API_KEY: re_ci_dummy_value_for_build_only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # October 21, 2026 Node.js security release. Keep the patch pin.
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        # No bloquea todavía: hay errores heredados. Quitar esta línea
        # cuando estén limpios, para que el lint pase a ser obligatorio.
        continue-on-error: true
        run: pnpm lint

      - name: Build
        run: pnpm exec next build
