<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="100%" height="100%">
  <rect width="1080" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ai-arrow-cyan" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#0284c7"/>
    </marker>
    <marker id="ai-arrow-indigo" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#6366f1"/>
    </marker>
    <marker id="ai-arrow-emerald" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <polygon points="0,0 8,4 0,8" fill="#10b981"/>
    </marker>
  </defs>

  <text x="32" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">AI brain dump → tasks</text>
  <text x="1048" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">BYO key in Settings · AES-256-GCM</text>

  <rect x="32" y="48" width="220" height="236" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <g transform="translate(52, 70)" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round">
    <rect x="8" y="4" width="16" height="22" rx="8"/>
    <line x1="16" y1="26" x2="16" y2="30"/>
    <line x1="11" y1="30" x2="21" y2="30"/>
  </g>
  <text x="52" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Voice or text</text>
  <text x="52" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Paste notes or record</text>
  <text x="52" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">audio from the board.</text>
  <text x="52" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Needs an AI API key</text>
  <path d="M32 248 H252 V270 Q252 284 238 284 H46 Q32 284 32 270 Z" fill="#0f172a"/>
  <text x="142" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#ffffff">INPUT</text>

  <line x1="252" y1="148" x2="304" y2="148" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ai-arrow-cyan)"/>
  <rect x="234" y="134" width="88" height="28" rx="12" fill="#0284c7"/>
  <text x="278" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TRANSCRIBE</text>

  <rect x="312" y="48" width="220" height="236" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
  <g transform="translate(332, 70)" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round">
    <rect x="6" y="8" width="20" height="16" rx="3"/>
    <path d="M10 14 h12 M10 18 h8"/>
    <path d="M16 4 v4"/>
  </g>
  <text x="332" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Speech → text</text>
  <text x="332" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">OpenAI Whisper, or</text>
  <text x="332" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Gemini multimodal</text>
  <text x="332" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">via /api/ai/transcribe</text>
  <path d="M312 248 H532 V270 Q532 284 518 284 H326 Q312 284 312 270 Z" fill="#0f172a"/>
  <text x="422" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#ffffff">AUDIO</text>

  <line x1="532" y1="148" x2="584" y2="148" stroke="#6366f1" stroke-width="2.5" marker-end="url(#ai-arrow-indigo)"/>
  <rect x="528" y="134" width="60" height="28" rx="12" fill="#6366f1"/>
  <text x="558" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">PARSE</text>

  <rect x="592" y="48" width="220" height="236" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <g transform="translate(612, 68)" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round">
    <rect x="6" y="8" width="20" height="18" rx="4"/>
    <line x1="16" y1="8" x2="16" y2="4"/>
    <circle cx="16" cy="3.5" r="1.6"/>
    <circle cx="12" cy="16" r="1.3" fill="#6366f1" stroke="none"/>
    <circle cx="20" cy="16" r="1.3" fill="#6366f1" stroke="none"/>
    <path d="M12 21 h8"/>
  </g>
  <text x="612" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LLM parse</text>
  <text x="612" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">/api/ai/parse turns</text>
  <text x="612" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">prose into titled</text>
  <text x="612" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">tasks + subtasks</text>
  <path d="M592 248 H812 V270 Q812 284 798 284 H606 Q592 284 592 270 Z" fill="#0f172a"/>
  <text x="702" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#ffffff">AGENT</text>

  <line x1="812" y1="148" x2="864" y2="148" stroke="#10b981" stroke-width="2.5" marker-end="url(#ai-arrow-emerald)"/>
  <rect x="821" y="134" width="74" height="28" rx="12" fill="#10b981"/>
  <text x="858" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">BATCH</text>

  <rect x="872" y="48" width="176" height="236" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <g transform="translate(892, 70)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round">
    <rect x="6" y="6" width="20" height="8" rx="2"/>
    <rect x="6" y="18" width="20" height="8" rx="2"/>
  </g>
  <text x="892" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Create many</text>
  <text x="892" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">batchTasks writes</text>
  <text x="892" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">cards + activity</text>
  <text x="892" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">brainDump</text>
  <path d="M872 248 H1048 V270 Q1048 284 1034 284 H886 Q872 284 872 270 Z" fill="#0f172a"/>
  <text x="960" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#ffffff">BOARD</text>
</svg>
