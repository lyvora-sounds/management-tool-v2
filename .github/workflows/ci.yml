name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación
    runs-on: ubuntu-latest

    # Base de datos desechable. Sirve para aplicar las migraciones desde cero,
    # que es justo el camino que se rompió cuando un cambio de schema.prisma
    # llegó a main sin su migración.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Conexión directa a la base del runner: sin pooler, así que el advisory
      # lock de `migrate deploy` funciona sin el P1002 que vimos en Vercel.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/ci
      # Valores ficticios: solo tienen que dejar compilar, nunca se conectan
      # a ningún servicio real. No pongáis credenciales de verdad aquí.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZHVtbXktY2xlcmsta2V5LWZvci1idWlsZCQ
      CLERK_SECRET_KEY: sk_test_ci_dummy_value_for_build_only
      ENCRYPTION_SECRET: ci-dummy-encryption-secret-not-a-real-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Resend construye su cliente a nivel de módulo en la ruta de
      # invitaciones, así que el build falla si esta variable no existe.
      RESEND_API_KEY: re_ci_dummy_value_for_build_only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones sobre una base vacía
        run: pnpm exec prisma migrate deploy

      - name: Comprobar que schema.prisma coincide con las migraciones
        # Si sale SQL, es que schema.prisma cambió sin generar la migración.
        # El primer comando lo imprime para poder leerlo; el segundo falla.
        run: |
          pnpm exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --script
          pnpm exec prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        # No bloquea todavía: hay 47 errores heredados. Quitar esta línea
        # cuando estén limpios, para que el lint pase a ser obligatorio.
        continue-on-error: true
        run: pnpm lint

      - name: Build
        run: pnpm exec next build
