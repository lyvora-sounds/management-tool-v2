  <text x="596" y="210" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">title · order</text>
  <text x="596" y="230" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Kanban column</text>
  <text x="596" y="250" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5E7695">Done title → complete</text>

  <line x1="776" y1="195" x2="840" y2="195" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.75" marker-end="url(#dmTipGold)"/>
